name: CI

on:
  pull_request:
    branches: [main, codex/gif-tools-experimental]
  merge_group:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
      tool: ${{ steps.filter.outputs.tool }}
      media: ${{ steps.filter.outputs.media }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Select suites for the candidate diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/ci/select-suites.mjs

  quality:
    name: Quality Checks
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check the production dependency graph
        run: npm run knip:production

      - name: Check CI path boundaries
        run: npm run verify:ci-boundaries

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Verify real GIF fixtures with independent decoders
        if: needs.detect-changes.outputs.tool == 'true'
        run: |
          python3 -m venv /tmp/ytgify-gif-oracle
          /tmp/ytgify-gif-oracle/bin/pip install -r scripts/gif-fixtures/requirements.txt
          /tmp/ytgify-gif-oracle/bin/python scripts/gif-fixtures/verify.py > gif-oracle-receipt.json

      - name: Upload GIF oracle evidence
        if: always() && needs.detect-changes.outputs.tool == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gif-oracle-evidence
          path: gif-oracle-receipt.json
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  build-test-app:
    name: Build Test Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: >-
      !cancelled() && needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.site == 'true' ||
       needs.detect-changes.outputs.tool == 'true')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node

      - name: Build test application
        run: npm run build

      - name: Verify public tool routes
        run: npm run verify:public-tool

      - name: Upload static test application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-application
          path: out/
          retention-days: 1
          if-no-files-found: error

  site-browser-tests:
    name: Site Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-test-app]
    if: >-
      always() && !cancelled() && needs.build-test-app.result == 'success' &&
      needs.detect-changes.outputs.site == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-application
          path: out/

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start static test server
        run: |
          npx serve out -l 3217 > /tmp/ytgify-serve.log 2>&1 &
          for _attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3217/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/ytgify-serve.log
          exit 1

      - name: Run landing, blog, and welcome tests
        run: npx playwright test tests/smoke.spec.ts tests/blog-seo.spec.ts tests/welcome.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3217

  video-to-gif-browser-tests:
    name: Video-to-GIF Browser Tests
    runs-on: ubuntu-latest
    # Real multi-browser exports take ~11m, plus browser setup and the privacy rebuild.
    timeout-minutes: 25
    needs: [detect-changes, build-test-app]
    if: >-
      always() && !cancelled() && needs.build-test-app.result == 'success' &&
      needs.detect-changes.outputs.tool == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-application
          path: out/

      - name: Install browser matrix
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Install media inspection and native Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install chrome
          python3 -m venv /tmp/ytgify-gif-oracle
          /tmp/ytgify-gif-oracle/bin/pip install -r scripts/gif-fixtures/requirements.txt

      - name: Start static test server
        run: |
          npx serve out -l 3217 > /tmp/ytgify-serve.log 2>&1 &
          for _attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3217/video-to-gif > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/ytgify-serve.log
          exit 1

      - name: Run video-to-GIF workflow, accessibility, and SEO tests
        run: node scripts/ci/run-media-tests.mjs
        env:
          SELECTED_MEDIA: ${{ needs.detect-changes.outputs.media }}
          GIF_ORACLE_PYTHON: /tmp/ytgify-gif-oracle/bin/python
          PLAYWRIGHT_BASE_URL: http://localhost:3217

      - name: Upload real media exports and browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gif-tools-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Verify enabled analytics privacy with a local test key
        run: npm run test:gif-privacy
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3217

      - name: Upload enabled analytics privacy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gif-tools-privacy-evidence
          path: test-results/
          retention-days: 14

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [detect-changes, quality, build-test-app, site-browser-tests, video-to-gif-browser-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require successful or intentionally skipped jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-gate.mjs
