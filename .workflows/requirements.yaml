    label: What maximum source GIF size should the compressor guarantee for this
      journey?
    answer:
      type: quantity
      value: 10485760
      unit: bytes
    scope:
      kind: journey
      workflowIds:
        - ytgify.gif-compressor
      perspectiveIds:
        - performance
