schema: agent-workflow-config/v1
project:
  id: ytgify
  appName: Ytgify
  defaultTargetId: local
  targets:
    - id: local
      label: Local
      environment: local
      baseUrl: http://localhost:3001
      healthPath: /video-to-gif
    - id: production
      label: Production
      environment: production
      baseUrl: https://ytgify.com
      healthPath: /video-to-gif
paths:
  definitions: .workflows/workflows
  runStore: .workflows/local
platforms:
  desktop-web:
    adapter: browser
    viewport: default-desktop
  mobile-web:
    adapter: browser
    viewport:
      width: 393
      height: 852
evidence:
  screenshots: declared-checkpoints
  failureRecording: video-or-trace
  retainVerifiedDownloads: true
studio:
  host: localhost
  port: auto
  openBrowser: false
security:
  omitHeaders:
    - authorization
    - cookie
    - set-cookie
  rejectPathTraversal: true
